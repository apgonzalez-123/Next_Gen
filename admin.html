<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextGen — Responses</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=202609211826">
<link rel="stylesheet" href="assets/admin.css?v=202609211826">
</head>
<body class="admin">

<header class="a-top">
  <div class="wordmark"><b>NextGen</b> <span>Responses</span></div>
  <div class="a-tools">
    <span id="srcBadge" class="p-badge"></span>
    <span class="a-stat"><b id="nCount">0</b> responses</span>
    <button class="p-btn" id="btnCsv" type="button">Download CSV</button>
    <button class="p-btn" id="btnJson" type="button">Download JSON</button>
  </div>
</header>

<section class="a-gate" id="gate" hidden>
  <div class="a-gate-box">
    <h2 class="display">Responses</h2>
    <p>This board shows guests&rsquo; names and their answers. Enter the session password to continue.</p>
    <label class="field">
      <span class="field-label">Password</span>
      <input class="field-input" id="gateKey" type="password" autocomplete="current-password">
    </label>
    <p class="a-gate-msg" id="gateMsg"></p>
    <button class="btn btn-primary" id="gateGo" type="button">Unlock</button>
  </div>
</section>

<main class="a-main" id="board" hidden>
  <section class="a-sections">
    <div class="a-sec-head">
      <div>
        <h2>Sections</h2>
        <p>Open each one as you reach that part of the presentation. Guests waiting on a
           closed section move on by themselves the moment you open it.</p>
      </div>
      <div class="a-sec-bulk">
        <button class="p-btn" id="secAllOpen" type="button">Open all</button>
        <button class="p-btn" id="secAllShut" type="button">Close all</button>
      </div>
    </div>
    <div class="a-sec-list" id="secList"></div>
    <p class="a-sec-note" id="secNote"></p>
  </section>

  <p class="a-note" id="note"></p>
  <div class="a-scroll">
    <table class="a-table" id="table">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<script src="assets/config.js?v=202609211826"></script>
<script src="assets/schema.js?v=202609211826"></script>
<script src="assets/portfolios.js?v=202609211826"></script>
<script src="assets/base-loader.js?v=202609211826"></script>
<script src="assets/store.js?v=202609211826"></script>
<script src="assets/admin.js?v=202609211826"></script>
</body>
</html>
